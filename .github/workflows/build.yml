name: Build Android APK

# Single-run pipeline: push to main -> unit tests -> build -> artifact.
# If the versionName in app/build.gradle.kts has no GitHub Release yet,
# the SAME run also creates the release (tag + both APKs) — no separate
# tag-push run needed. Cutting a release = bump version & push to main.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses & install components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" "build-tools;36.0.0" > /dev/null

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Restore stable signing keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 is not set on this repository."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug & release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Read app version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "Releasing as version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish release with APKs (same run — only when this version has no release yet)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping (artifact-only run)."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "SpendWise-${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "SpendWise-${VERSION}-debug.apk"
          # Version-less copies keep the evergreen "latest" permalink working:
          # .../releases/latest/download/SpendWise-release.apk
          cp app/build/outputs/apk/release/app-release.apk "SpendWise-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "SpendWise-debug.apk"
          {
            printf '%s\n' \
              'Two flavors are attached:' \
              '- **release** — R8-minified (~4 MB), signed with the stable upload key. Recommended for daily use.' \
              '- **debug** — unminified, per-run debug key. For testing only.' \
              '' \
              'Requires a 64-bit ARM (arm64-v8a) device with Android 8.0+.'
            PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV_TAG" "$VERSION"
            fi
          } > notes.md
          gh release create "$VERSION" \
            "SpendWise-${VERSION}-release.apk" \
            "SpendWise-${VERSION}-debug.apk" \
            "SpendWise-release.apk" \
            "SpendWise-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "SpendWise ${VERSION}" \
            --notes-file notes.md
          echo "Published release $VERSION (tag created at ${GITHUB_SHA})."
