name: One-off keystore export (recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore and credentials
        run: |
          mkdir -p out
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > out/spendwise-release.jks
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}" > out/spendwise-release.jks.meta
          chmod 600 out/spendwise-release.jks out/spendwise-release.jks.meta
          sha256sum out/spendwise-release.jks out/spendwise-release.jks.meta > out/SHA256SUMS

      - name: Upload recovery artifact (retention 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-recovery
          path: out/
          retention-days: 1
